name: 🚀 Feature Request
description: Suggest a new feature or enhancement
title: "[FEAT]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: dropdown
    id: service
    attributes:
      label: 📦 Target Service
      description: Which part of the application would this feature affect?
      options:
        - Frontend (UI / React)
        - Backend API (Express / Node.js)
        - Database (PostgreSQL / Drizzle)
        - Authentication
        - Payments / Stripe
        - CI/CD / DevOps
        - Cross-cutting (both frontend & backend)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🔍 Problem / Motivation
      description: What problem does this feature solve? Why is it needed?
      placeholder: "Currently, users cannot filter products by price range, making it hard to find affordable items..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed Solution
      description: Describe the feature you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternatives Considered
      description: Have you considered other approaches? If so, why was this one chosen?

  - type: dropdown
    id: priority
    attributes:
      label: ⚡ Priority
      options:
        - High (core business value)
        - Medium (nice-to-have)
        - Low (future consideration)
    validations:
      required: true
