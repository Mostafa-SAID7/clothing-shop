<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- Primary SEO -->
    <title>HAVEN — Premium Fashion Store</title>
    <meta name="description" content="HAVEN is your destination for premium clothing. Discover T-Shirts, Jeans, Hoodies, and Jackets. Shop the latest trends with free shipping on orders over $50." />
    <meta name="keywords" content="haven, fashion, clothing, t-shirts, jeans, hoodies, jackets, style, premium fashion, online store" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="HAVEN" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HAVEN" />
    <meta property="og:title" content="HAVEN — Premium Fashion Store" />
    <meta property="og:description" content="Discover the latest trends in fashion. Shop premium T-Shirts, Jeans, Hoodies and Jackets at HAVEN." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=1200&q=80" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HAVEN — Premium Fashion Store" />
    <meta name="twitter:description" content="Discover the latest trends in fashion. Shop premium clothing at HAVEN." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=1200&q=80" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "HAVEN",
      "description": "Premium online clothing store offering T-Shirts, Jeans, Hoodies, and Jackets.",
      "logo": "/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-555-234-5678",
        "contactType": "customer service",
        "email": "hello@haven.style",
        "availableLanguage": ["English", "Arabic"]
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts: Inter (EN) + Cairo (AR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color -->
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
