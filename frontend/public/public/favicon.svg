<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGradient)"/>
  
  <!-- Subtle border -->
  <rect width="180" height="180" rx="36" fill="none" stroke="#333333" stroke-width="1" opacity="0.5"/>
  
  <!-- "H" Letter with modern styling -->
  <g transform="translate(90, 90)">
    <!-- Left vertical bar -->
    <rect x="-28" y="-35" width="12" height="70" rx="6" fill="url(#textGradient)"/>
    
    <!-- Right vertical bar -->
    <rect x="16" y="-35" width="12" height="70" rx="6" fill="url(#textGradient)"/>
    
    <!-- Horizontal bar (center) -->
    <rect x="-28" y="-8" width="56" height="12" rx="6" fill="url(#textGradient)"/>
    
    <!-- Accent dot (top right) -->
    <circle cx="32" cy="-32" r="4" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
