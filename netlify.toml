[build]
command = "cd frontend && pnpm install && pnpm build"
publish = "frontend/dist"

[build.environment]
NODE_VERSION = "20"
# Frontend environment variables
VITE_API_URL = "https://clothing-shop-api.vercel.app/api"
VITE_STRIPE_PUBLIC_KEY = "pk_live_your_public_key_here"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
